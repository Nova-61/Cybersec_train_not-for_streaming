services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes: # Явно указывам место хранения данных PostgreSQL, чтобы они сохранялись между перезапусками контейнера
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"] # утилите позвляющая проверить готовность PostgreSQL к подключению
      interval: 5s # Иначе он умпдет с ошибкой
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes: # Явно указывам место хранения данных Redis, чтобы они сохранялись между перезапусками контейнера
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # утилите позвляющая проверить готовность Redis к подключению
      interval: 5s # Иначе он умпдет с ошибкой
      timeout: 5s
      retries: 5

  auth:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: auth_db
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      JWT_SECRET: change-this-to-a-random-32-plus-character-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: